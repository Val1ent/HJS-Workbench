# Continuous integration: install the runtime dependencies and run the
# non-interactive self-check on every push to main and every pull request
# targeting main. The self-check step must fail the job when its exit code
# is non-zero, so a regression is exposed immediately.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  self-check:
    name: Install dependencies and self-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        # PySide6 wheels bundle Qt but rely on these system libraries on
        # headless Ubuntu; without them importing Qt fails even offscreen.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 \
            libxcb-cursor0 libxcb-xfixes0 libdbus-1-3
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax compile check
        run: python -m compileall -q core cli gui
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: GUI self-check
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m gui --check
