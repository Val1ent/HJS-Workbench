# Multi-platform release: triggered by a tag push matching "v*" or by a
# manual workflow_dispatch that names an existing tag (so a release can be
# rebuilt without creating a new tag). The first job guarantees the GitHub
# Release exists and carries the installer script; the second job builds
# the CLI and GUI with PyInstaller on Windows, Linux, and macOS (arm64 and
# x86_64) and uploads each platform's own assets with the exact names that
# scripts/install.sh and docs/INSTALL.md expect.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.6.2)"
        required: true
        default: "v0.6.2"
        type: string

permissions:
  contents: write

jobs:
  ensure-release:
    name: Ensure release and installer script
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Derive tag and version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Create release when missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" > /dev/null 2>&1; then
            echo "Release ${{ steps.meta.outputs.tag }} already exists"
          else
            gh release create "${{ steps.meta.outputs.tag }}" \
              --verify-tag \
              --title "${{ steps.meta.outputs.tag }}" \
              --notes "Release ${{ steps.meta.outputs.tag }}"
          fi
      - name: Upload installer script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" scripts/install.sh --clobber

  build:
    name: Build ${{ matrix.asset_os }} ${{ matrix.arch }}
    needs: ensure-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset_os: linux
            arch: x86_64
          - runner: windows-latest
            asset_os: windows
            arch: x86_64
          - runner: macos-latest
            asset_os: macos
            arch: arm64
          - runner: macos-26-intel
            asset_os: macos
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 \
            libxcb-cursor0 libxcb-xfixes0 libdbus-1-3
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: GUI self-check
        run: python -m gui --check
      - name: Build GUI bundle
        run: pyinstaller packaging/gui.spec --noconfirm
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup --limit-output --no-progress -y }
      - name: Build Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: python packaging/build_installer.py
      - name: Upload Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.ensure-release.outputs.tag }}" "dist/HJS-Workbench-Setup-${{ needs.ensure-release.outputs.version }}.exe" --clobber
      - name: Build CLI executable
        run: pyinstaller packaging/cli.spec --noconfirm
      - name: Package GUI bundle (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "dist/HJSWorkbench-GUI-${{ needs.ensure-release.outputs.version }}-${{ matrix.asset_os }}-${{ matrix.arch }}.tar.gz" -C dist HJSWorkbench-GUI
      - name: Package GUI bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import shutil; shutil.make_archive('dist/HJSWorkbench-GUI-${{ needs.ensure-release.outputs.version }}', 'zip', root_dir='dist', base_dir='HJSWorkbench-GUI')"
      - name: Rename CLI (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mv "dist/HJSWorkbench-CLI" "dist/HJSWorkbench-CLI-${{ matrix.asset_os }}-${{ matrix.arch }}"
      - name: Rename CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item "dist/HJSWorkbench-CLI.exe" "HJSWorkbench-CLI-${{ needs.ensure-release.outputs.version }}.exe"
      - name: Upload CLI asset (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.ensure-release.outputs.tag }}" \
            "dist/HJSWorkbench-CLI-${{ matrix.asset_os }}-${{ matrix.arch }}" --clobber
      - name: Upload GUI asset (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.ensure-release.outputs.tag }}" \
            "dist/HJSWorkbench-GUI-${{ needs.ensure-release.outputs.version }}-${{ matrix.asset_os }}-${{ matrix.arch }}.tar.gz" --clobber
      - name: Upload CLI asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.ensure-release.outputs.tag }}" "dist/HJSWorkbench-CLI-${{ needs.ensure-release.outputs.version }}.exe" --clobber
      - name: Upload GUI asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.ensure-release.outputs.tag }}" "dist/HJSWorkbench-GUI-${{ needs.ensure-release.outputs.version }}.zip" --clobber
